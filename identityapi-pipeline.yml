trigger:
- main

resources:
- repo: self

variables:
  # Container registry service connection established during pipeline creation
  dockerRegistryServiceConnection: 'd0ee37c6-ad7b-407e-b5ff-b7bf63093093'
  imageRepository: 'identityapi'
  containerRegistry: 'tmsolutioncr.azurecr.io'
  dockerfilePath: '**/Dockerfile'
  tag: '$(Build.BuildId)'
  helmVersion: 3.7.0
  HELM_EXPERIMENTAL_OCI: 1

  # Agent VM image name
  vmImageName: 'ubuntu-latest'

stages:
- stage: Build image
  displayName: Build and push docker image
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: Docker@2
      displayName: Build and push an image to container registry
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)
- stage: Build helm chart
  displayName: Build and push helm chart
  jobs:
    - job: Build      
      steps:
        - task: HelmInstaller@0
          displayName: Build and push helm chart to container registry
          inputs:
             helmVersion: $(helmVersiion)
             installKubectl: false
        - script: |
            helm chart save $(build.sourcesdirectory)/src/$(imageRepository)-chart/ $(containerRegistry)/$(imageRepository):latest
          displayName: save the chart and set the alias