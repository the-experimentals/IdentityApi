trigger:
- main

resources:
- repo: self

variables:
  # Container registry service connection established during pipeline creation
  dockerRegistryServiceConnection: 'd0ee37c6-ad7b-407e-b5ff-b7bf63093093'
  imageRepository: 'identityapi'
  containerRegistry: 'tmsolutioncr.azurecr.io'
  dockerfilePath: '**/Dockerfile'
  tag: '$(Build.BuildId)'
  helmVersion: 3.7.0
  HELM_EXPERIMENTAL_OCI: 1
  helmChart: './identityapi-chart'

  # Agent VM image name
  vmImageName: 'ubuntu-latest'

stages:
- stage: BuildImage
  displayName: Build and push docker image
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: Docker@2
      displayName: Build and push an image to container registry
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)
- stage: BuildHelmChart
  displayName: Build and push helm chart
  jobs:
    - job: Build      
      steps:
        - task: HelmInstaller@1
          displayName: 'install helm'
          inputs:
            helmVersionToInstall: $(helmVersion)
        - bash: |
            # run helm lint
            helm lint $(helmChart)
          failOnStderr: true
          displayName: 'helm lint'
        - bash: |
            helm package \
            --app-version $(tag) \
            $(helmChart)
          failOnStderr: true
          displayName: 'helm package'
        