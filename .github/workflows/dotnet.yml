name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v2
      with:
        dotnet-version: 6.0.x
    - name: Restore dependencies
      run: dotnet restore ./IdentityApi.sln
    - name: Build
      run: dotnet build ./IdentityApi/IdentityApi.csproj --no-restore
    - name: Test
      run: dotnet test ./IdentityApiTest/IdentityApiTest.csproj --verbosity normal
    - name: Build image
      run: docker build "**/Dockerfile" -t identityapi .
    - name: Install doctl
      uses: digitalocean/action-doctl@v2
      with:
        token: ""
    - name: Container registry login
      run: doctl registry login --expiry-seconds 600
    - name: Tag image
      run: 
        docker tag identityapi \
        registry.digitalocean.com/tmsolution-cr/identityapi:${{github.event.inputs.version }}
  
