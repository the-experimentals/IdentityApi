name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  
  build:
    uses: itsbibeksaini/github-workflows/.github/workflows/dotnet-build-and-push.yml@main
    with:
      SOLUTION_FILE: ./IdentityApi.sln
      PROJECT_FILE: ./IdentityApi/IdentityApi.csproj
      TEST_PROJECT_FILE: ./IdentityApiTest/IdentityApiTest.csproj
      IMAGE_NAME: identityapi
      DOCKER_FILE: IdentityApi/Dockerfile
    secrets:
      DIGITALOCEAN_ACCESS_TOKEN: ${{secrets.DIGITALOCEAN_ACCESS_TOKEN}}
      REGISTRY_NAME: ${{secrets.REGISTRY_NAME}}  
