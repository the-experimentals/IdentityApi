jobs:

  job1:
    runs-on: ubuntu-latest
    # Map a step output to a job output
    outputs:
      output1: ${{ steps.step1.outputs.test }}
      output2: ${{ steps.step2.outputs.test }}
    steps:
      - id: step1
        run: echo "test=hello" >> $GITHUB_OUTPUT
      - id: step2
        run: echo "test=world" >> $GITHUB_OUTPUT
  job2:
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - run: echo ${{needs.job1.outputs.output1}} ${{needs.job1.outputs.output2}}
    
  build:
    uses: itsbibeksaini/github-actions-workflows/.github/workflows/dotnet-build.yml@main
    needs: job1
    with:
      SOLUTION_FILE: ./IdentityApi.sln
      PROJECT_FILE: ./IdentityApi/IdentityApi.csproj
      TEST_PROJECT_FILE: ./IdentityApiTest/IdentityApiTest.csproj

#   compute_tag:
#     runs-on: ubuntu-latest
#     needs: build
#     steps:
#       - name: Set env
#         run: echo "GITHUB_SHA_SHORT=$(echo $GITHUB_SHA | cut -c 1-6)" >> $GITHUB_ENV
#       - name: Test
#         run: echo $GITHUB_SHA_SHORT
        
  image:
    uses: itsbibeksaini/github-actions-workflows/.github/workflows/docker-build.yml@main
    needs: build
    with:
      DOCKERFILE: "IdentityApi/Dockerfile"
      IMAGE_NAME: "identityapi"
      TAG: echo ${{needs.job1.outputs.output1}} ${{needs.job1.outputs.output2}}
      
  push:
    uses: itsbibeksaini/github-actions-workflows/.github/workflows/push-docker-image.yml@main
    needs: image
    secrets:
      DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
  deploy:
    uses: itsbibeksaini/github-actions-workflows/.github/workflows/helm-deploy.yml@main
    needs: push
    secrets:
      DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      
