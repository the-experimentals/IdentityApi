name: IdentityApi

trigger:
- identityapi-pipeline

pool:
  vmImage: ubuntu-latest

variables:
  helmVersion: 3.7.0
  HELM_EXPERIMENTAL_OCI: 1
  tag: '$(Build.BuildId)'
  dockerfilePath: '**/Dockerfile'
  dockerRegistryServiceConnection: 'edea4587-93d3-4dbd-8ce3-0993c5d229d6'
  imageRepository: 'identityapi'

stages:
  - stage: Build
    displayName: Build
    jobs:
      - job: Build
        displayName: Build docker image
        steps:
          - task: Docker@2
            displayName: Build and push an image to container
            inputs:
              repository: $(imageRepository)
              Dockerfile: $(dockerfilePath)
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: |
                $(tag)