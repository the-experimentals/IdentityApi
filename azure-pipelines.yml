name: IdentityApi

trigger:
- main

# resources:
#   repositories:
#     - repository: templates
#       type: github
#       name: itsbibeksaini/pipeline-templates
#       endpoint: github.com_itsbibeksaini

pr: none

pool:
  vmImage: ubuntu-latest

stages:
- stage: BuildImage
  displayName: Build and push .NET Application.
  jobs:  
  - job: Build
    displayName: Building .NET Application.
    steps:         
      - task: UseDotNet@2
        displayName: Install .NET SDK.
        inputs:
          version: '6.0.x'
      - task: DotNetCoreCLI@2
        displayName: Restore nuget packages.
        inputs:
          command: 'restore'
          feedsToUse: 'select'
          projects: "**/*.csproj"
          includeNuGetOrg: true
      - task: DotNetCoreCLI@2
        displayName: Build .NET Application.
        inputs:
          command: 'build'
          projects: ./IdentityApi.sln
          arguments: -c Release
      - task: DotNetCoreCLI@2
        displayName: Test .NET Application.
        inputs:
          command: test
          projects: '**/*Test/*.csproj'
      - task: DotNetCoreCLI@2
        displayName: Publish .NET Application.
        inputs:
          command: publish
          arguments: -c Release --output '$(Build.ArtifactStagingDirectory)/app/publish'
      - script: |
          ls          
      - task: Docker@2
        displayName: Build docker image.
        inputs:
          repository: identityapi
          command: build
          Dockerfile: '**/Dockerfile'
    
